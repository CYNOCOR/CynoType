name: Build CynoType Installers

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CynoType.exe
        shell: cmd
        run: build_win.bat

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CynoType-Windows
          path: dist/CynoType.exe

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Build CynoType-Installer.dmg
        run: |
          chmod +x build_mac.sh setup_mac.sh run_mac.command
          ./build_mac.sh

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CynoType-macOS
          path: dist/CynoType-Installer.dmg

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CynoType-Windows
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: CynoType-macOS
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/CynoType.exe
            release-assets/CynoType-Installer.dmg
